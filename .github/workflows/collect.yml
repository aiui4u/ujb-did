name: 통합 DID 자료 자동 수집

on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: did-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 수집기 파일 확인
        run: |
          test -f web/data.json
          test -f web/news.json
          node --check collector/collect.mjs
          bash -n collector/save-and-deploy.sh

      - name: 날씨·특보·뉴스 우선 수집
        id: realtime
        timeout-minutes: 5
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
        run: node collector/collect.mjs --realtime

      - name: 실시간 JSON 우선 저장 및 게시
        if: ${{ always() && steps.realtime.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash collector/save-and-deploy.sh

      - name: 예정된 통계 및 진행 중 작업 수집
        id: statistics
        timeout-minutes: 20
        env:
          POPULATION_API_KEY: ${{ secrets.POPULATION_API_KEY }}
          BIRTH_API_KEY: ${{ secrets.BIRTH_API_KEY }}
          COMMERCE_API_KEY: ${{ secrets.COMMERCE_API_KEY }}
          TRAFFIC_API_KEY: ${{ secrets.TRAFFIC_API_KEY }}
        run: node collector/collect.mjs --statistics

      - name: 통계 JSON 및 진행 상태 저장
        if: ${{ always() && steps.statistics.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash collector/save-and-deploy.sh
