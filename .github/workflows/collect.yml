name: 통합 DID 자료 자동 수집

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: did-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 수집기 파일 확인
        run: |
          test -f web/data.json
          test -f web/news.json
          node --check collector/collect.mjs

      - name: 자료 수집
        id: collect
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          POPULATION_API_KEY: ${{ secrets.POPULATION_API_KEY }}
          BIRTH_API_KEY: ${{ secrets.BIRTH_API_KEY }}
          COMMERCE_API_KEY: ${{ secrets.COMMERCE_API_KEY }}
          TRAFFIC_API_KEY: ${{ secrets.TRAFFIC_API_KEY }}
        run: node collector/collect.mjs

      - name: 갱신된 JSON과 수집 상태 저장
        id: save
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/data.json web/news.json
          if [ -f collector/state.json ]; then
            git add collector/state.json
          fi

          if git diff --cached --quiet; then
            echo "저장할 변경사항 없음"
            exit 0
          fi

          git commit -m "data: 통합 DID 자료 갱신"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 갱신된 자료로 사이트 게시
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
